# sources.yaml — Customer Source Configuration
# Define all data sources for this deployment.
# This file is read by the phx-ingest service at startup and on each sync cycle.
#
# SECURITY NOTES:
#   - All database credentials must use READ-ONLY accounts
#   - File paths are mounted read-only into the container
#   - Do not use admin or write-capable database accounts here

tenant_id: "acme-corp"

sources:

  # ---------------------------------------------------------------------------
  # FILESYSTEM SOURCES
  # Each filesystem source points to a directory mounted into the ingest container.
  # ---------------------------------------------------------------------------

  - id: "shared-docs"
    type: filesystem
    enabled: true
    path: /customer_data/shared
    department: shared
    access_tags:
      - shared_user
      - operations
      - hr
      - management
      - admin
    doc_type: policy
    include_patterns:
      - "**/*.txt"
      - "**/*.md"
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.csv"
      - "**/*.xlsx"
    exclude_patterns:
      - "**/.DS_Store"
      - "**/~$*"
      - "**/*.tmp"
    chunk_size: 512
    chunk_overlap: 64

  - id: "operations-docs"
    type: filesystem
    enabled: true
    path: /customer_data/operations
    department: operations
    access_tags:
      - operations
      - management
      - admin
    doc_type: procedure
    include_patterns:
      - "**/*.txt"
      - "**/*.md"
      - "**/*.pdf"
      - "**/*.docx"
    exclude_patterns:
      - "**/.DS_Store"
      - "**/~$*"
    chunk_size: 512
    chunk_overlap: 64

  - id: "hr-docs"
    type: filesystem
    enabled: true
    path: /customer_data/hr
    department: hr
    access_tags:
      - hr
      - admin
    doc_type: hr_policy
    include_patterns:
      - "**/*.txt"
      - "**/*.md"
      - "**/*.pdf"
      - "**/*.docx"
    exclude_patterns:
      - "**/.DS_Store"
    chunk_size: 512
    chunk_overlap: 64

  - id: "management-docs"
    type: filesystem
    enabled: true
    path: /customer_data/management
    department: management
    access_tags:
      - management
      - admin
    doc_type: strategy
    include_patterns:
      - "**/*.txt"
      - "**/*.md"
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.xlsx"
    exclude_patterns:
      - "**/.DS_Store"
    chunk_size: 512
    chunk_overlap: 64

